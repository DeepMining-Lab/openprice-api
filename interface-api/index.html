<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Applied before the stylesheet is evaluated, so the right theme paints on the
    // very first frame (no dark-to-light or light-to-dark flash on load).
    (function () {
      try {
        var t = localStorage.getItem('op-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (_) {}
    })();
  </script>
  <title>Open Price Explorer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    /* Light palette is the default; the dark palette below overrides it either when the
       OS prefers dark AND no explicit choice was made, or when data-theme="dark" is set
       explicitly. data-theme="light" always wins over the OS preference. */
    :root {
      --bg:         #f8fafc;
      --surface:    #ffffff;
      --surface2:   #f1f5f9;
      --surface3:   #e2e8f0;
      --border:     #e2e8f0;
      --border2:    #cbd5e1;
      --text:       #0f172a;
      --muted:      #64748b;
      --accent:     #475569;
      --accent2:    #334155;
      --ok:         #16a34a;
      --warn:       #b45309;
      --err:        #dc2626;
      --purple:     #9333ea;
      --tagv1:      #475569;
      --tagv2:      #7e22ce;
      --tagv3:      #0e7490;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:         #0a0f1e;
        --surface:    #111827;
        --surface2:   #1f2937;
        --surface3:   #374151;
        --border:     #374151;
        --border2:    #4b5563;
        --text:       #f9fafb;
        --muted:      #9ca3af;
        --accent:     #94a3b8;
        --accent2:    #64748b;
        --ok:         #22c55e;
        --warn:       #f59e0b;
        --err:        #ef4444;
        --purple:     #a855f7;
        --tagv1:      #cbd5e1;
        --tagv2:      #c084fc;
        --tagv3:      #22d3ee;
      }
    }
    :root[data-theme="dark"] {
      --bg:         #0a0f1e;
      --surface:    #111827;
      --surface2:   #1f2937;
      --surface3:   #374151;
      --border:     #374151;
      --border2:    #4b5563;
      --text:       #f9fafb;
      --muted:      #9ca3af;
      --accent:     #94a3b8;
      --accent2:    #64748b;
      --ok:         #22c55e;
      --warn:       #f59e0b;
      --err:        #ef4444;
      --purple:     #a855f7;
      --tagv1:      #cbd5e1;
      --tagv2:      #c084fc;
      --tagv3:      #22d3ee;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      line-height: 1.5;
      transition: background .15s, color .15s;
    }

    /* ─── Layout ─────────────────────────────────────────────────── */
    .container { max-width: 760px; margin: 0 auto; }

    /* ─── Header ─────────────────────────────────────────────────── */
    .header { text-align: center; margin-bottom: 2.5rem; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .6rem;
    }
    .logo-icon {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--text); /* dark mark on light theme, light mark on dark theme */
    }
    .logo h1 {
      font-size: 1.6rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: var(--muted); font-size: .875rem; }

    /* ─── API bar ────────────────────────────────────────────────── */
    .api-bar {
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      row-gap: .6rem;
      margin-bottom: 1.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .4rem .75rem;
    }
    .api-bar label { font-size: .7rem; color: var(--muted); white-space: nowrap; }
    .api-bar input:not([type="checkbox"]) {
      flex: 1; min-width: 120px; background: transparent; border: none;
      color: var(--text); font-size: .8rem; outline: none;
      font-family: monospace;
    }
    #api-dot { font-size: .65rem; white-space: nowrap; }

    /* Second row of the bar: gateway API key */
    .key-row {
      flex-basis: 100%;
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      padding-top: .45rem; border-top: 1px solid var(--border);
    }
    .key-remember { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; }
    .key-remember input { accent-color: var(--accent); cursor: pointer; }
    /* Native checkbox: dark rendering on the dark theme (same conditions as the dark palette) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .key-remember input { color-scheme: dark; }
    }
    :root[data-theme="dark"] .key-remember input { color-scheme: dark; }
    .key-link {
      margin-left: auto; font-size: .7rem; white-space: nowrap;
      color: var(--accent); text-decoration: none;
    }
    .key-link:hover { color: var(--text); text-decoration: underline; }

    /* ─── Pill groups (version / language selectors) ────────────────── */
    .ver-wrap { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
    .pill-group {
      display: flex; border: 1px solid var(--border2);
      border-radius: 7px; overflow: hidden;
    }
    .pill-btn {
      padding: .3rem .7rem; background: transparent; border: none;
      color: var(--muted); cursor: pointer;
      font-size: .72rem; font-weight: 700; letter-spacing: .03em;
      transition: background .15s, color .15s;
    }
    .pill-btn:not(:last-child) { border-right: 1px solid var(--border2); }
    .pill-btn:hover { color: var(--text); }
    .pill-btn.active { background: linear-gradient(135deg, #475569, #334155); color: #fff; }

    /* ─── Theme toggle ───────────────────────────────────────────── */
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 7px;
      border: 1px solid var(--border2); background: transparent;
      color: var(--muted); cursor: pointer; flex-shrink: 0;
      transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ─── Info tooltip ───────────────────────────────────────────── */
    .info-tip {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%;
      border: 1px solid var(--border2); color: var(--muted);
      font-size: .68rem; font-weight: 700; cursor: help;
      transition: color .15s, border-color .15s;
    }
    .info-tip:hover { color: var(--accent); border-color: var(--accent); }
    .tip-box {
      position: absolute; top: calc(100% + 8px); right: -8px;
      width: 320px; max-width: 78vw;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 10px; padding: .9rem 1rem;
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
      font-size: .74rem; line-height: 1.5; color: var(--text);
      white-space: normal; text-align: left;
      opacity: 0; visibility: hidden; transform: translateY(-4px);
      transition: opacity .15s, transform .15s, visibility .15s;
      z-index: 30;
    }
    .info-tip:hover .tip-box { opacity: 1; visibility: visible; transform: translateY(0); }
    .tip-box::before {
      content: ''; position: absolute; top: -5px; right: 12px;
      width: 9px; height: 9px; background: var(--surface2);
      border-left: 1px solid var(--border2); border-top: 1px solid var(--border2);
      transform: rotate(45deg);
    }
    .tip-title {
      font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--accent); margin-bottom: .55rem;
    }
    .tip-row { display: flex; gap: .5rem; margin-bottom: .5rem; }
    .tip-row:last-child { margin-bottom: 0; }
    .tip-tag {
      flex-shrink: 0; font-weight: 700; font-size: .68rem;
      padding: .05rem .4rem; border-radius: 5px; height: fit-content;
      letter-spacing: .03em;
    }
    .tip-tag.v1 { background: color-mix(in srgb, var(--tagv1) 16%, transparent); color: var(--tagv1); }
    .tip-tag.v2 { background: color-mix(in srgb, var(--tagv2) 16%, transparent); color: var(--tagv2); }
    .tip-tag.v3 { background: color-mix(in srgb, var(--tagv3) 16%, transparent); color: var(--tagv3); }
    .tip-box code { font-family: monospace; color: var(--accent); font-size: .72rem; }
    .tip-box .muted { color: var(--muted); }

    /* ─── Card ───────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: background .15s, border-color .15s;
    }
    .section-title {
      font-size: .65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--muted); margin-bottom: 1rem;
    }
    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

    /* ─── Token pills ────────────────────────────────────────────── */
    .token-row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .token-btn {
      padding: .45rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border2);
      background: transparent;
      color: var(--muted);
      cursor: pointer; font-size: .9rem; font-weight: 700;
      letter-spacing: .03em;
      transition: border-color .15s, color .15s, background .15s;
    }
    .token-btn:hover { border-color: var(--accent); color: var(--accent); }
    .token-btn.active {
      background: linear-gradient(135deg, #475569, #334155);
      border-color: transparent; color: #fff;
    }

    /* ─── Granularity tabs ───────────────────────────────────────── */
    .gran-row { display: flex; align-items: center; gap: .75rem; }
    .gran-label { font-size: .8rem; color: var(--muted); }
    .gran-group {
      display: flex; border: 1px solid var(--border2);
      border-radius: 8px; overflow: hidden;
    }
    .gran-btn {
      padding: .4rem .9rem; background: transparent; border: none;
      border-right: 1px solid var(--border2);
      color: var(--muted); cursor: pointer;
      font-size: .8rem; font-weight: 500;
      transition: background .15s, color .15s;
    }
    .gran-btn:last-child { border-right: none; }
    .gran-btn:hover { color: var(--text); background: var(--surface2); }
    .gran-btn.active { background: var(--accent); color: #fff; }

    /* ─── Date / time inputs ─────────────────────────────────────── */
    .dt-row { display: flex; gap: .75rem; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: .3rem; }
    .field-label { font-size: .72rem; color: var(--muted); font-weight: 500; }
    .field input, .field select {
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 7px; color: var(--text);
      padding: .45rem .75rem; font-size: .875rem; outline: none;
      transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field input[type=number] { width: 74px; }
    .field input[type=date] { width: 160px; }

    /* Timestamp preview */
    .ts-preview {
      font-family: monospace; font-size: .75rem;
      color: var(--accent); margin-top: .5rem;
      min-height: 1.2em;
    }

    /* ─── Advanced toggle ────────────────────────────────────────── */
    .adv-toggle {
      display: flex; align-items: center; gap: .4rem;
      cursor: pointer; color: var(--muted);
      font-size: .78rem; user-select: none; margin-top: 1rem;
    }
    .adv-toggle:hover { color: var(--text); }
    .adv-chevron { transition: transform .2s; display: inline-block; }
    .adv-panel { display: none; margin-top: .75rem; }
    .adv-panel.open { display: block; }

    /* ─── Submit ─────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: .8rem;
      background: linear-gradient(135deg, #475569, #334155);
      color: #fff; border: none; border-radius: 9px;
      font-size: .95rem; font-weight: 600;
      cursor: pointer; margin-top: 1.25rem;
      transition: opacity .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: .6rem;
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ─── Results ────────────────────────────────────────────────── */
    #results { display: none; }

    /* Price display */
    .price-big {
      display: flex; align-items: baseline; gap: .75rem;
      flex-wrap: wrap; margin-bottom: .6rem;
    }
    .price-amount {
      font-size: 2.8rem; font-weight: 800;
      letter-spacing: -.03em; line-height: 1;
    }
    .price-sym { font-size: 1.2rem; color: var(--muted); font-weight: 500; }

    .badge {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .2rem .7rem; border-radius: 999px;
      font-size: .72rem; font-weight: 700; letter-spacing: .04em;
      border: 1px solid;
    }
    .b-0a { background: color-mix(in srgb, var(--ok) 12%, transparent);     color: var(--ok);     border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
    .b-0b { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .b-2  { background: color-mix(in srgb, var(--purple) 12%, transparent); color: var(--purple); border-color: color-mix(in srgb, var(--purple) 30%, transparent); }
    .b-3  { background: color-mix(in srgb, var(--warn) 12%, transparent);   color: var(--warn);   border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .b-4  { background: color-mix(in srgb, var(--err) 12%, transparent);    color: var(--err);    border-color: color-mix(in srgb, var(--err) 30%, transparent); }

    .meta-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .75rem; margin-top: .9rem;
    }
    .meta-cell { font-size: .78rem; }
    .meta-cell .label { color: var(--muted); margin-bottom: .1rem; }
    .meta-cell .value { color: var(--text); font-weight: 600; }

    /* Unavailable */
    .unavail-box {
      background: color-mix(in srgb, var(--err) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--err) 25%, transparent);
      border-radius: 9px; padding: 1rem 1.25rem;
      color: var(--err); font-size: .875rem;
    }

    /* ─── Confidence ─────────────────────────────────────────────── */
    .conf-layout { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }

    .gauge-wrap { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
    .gauge-wrap svg { display: block; }
    .gauge-label {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .gauge-score { font-size: 1.65rem; font-weight: 800; line-height: 1; }
    .gauge-sub   { font-size: .65rem; color: var(--muted); margin-top: .15rem; }

    .sub-scores { flex: 1; display: flex; flex-direction: column; gap: .85rem; min-width: 200px; }
    .ss-row { display: flex; flex-direction: column; gap: .28rem; }
    .ss-head { display: flex; justify-content: space-between; align-items: baseline; }
    .ss-name { font-size: .78rem; color: var(--muted); }
    .ss-val  { font-size: .82rem; font-weight: 700; }
    .ss-desc { font-size: .68rem; color: var(--border2); margin-top: -.1rem; }
    .prog { height: 5px; border-radius: 999px; background: var(--surface3); overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 999px; transition: width .7s cubic-bezier(.4,0,.2,1); }

    /* ─── Accordion ──────────────────────────────────────────────── */
    .acc-item {
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; margin-bottom: .6rem;
    }
    .acc-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: .8rem 1rem; cursor: pointer;
      background: var(--surface2); font-size: .83rem; font-weight: 600;
      user-select: none; transition: background .15s;
    }
    .acc-head:hover { background: var(--surface3); }
    .acc-chevron { transition: transform .2s; color: var(--muted); font-size: .75rem; }
    .acc-body {
      display: none; padding: 1rem; font-size: .8rem;
      color: var(--muted); background: var(--surface);
    }
    .acc-body.open { display: block; }
    .acc-body.open ~ .acc-head .acc-chevron { /* via JS */ }

    /* Provenance elements */
    .file-list { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
    .file-list li {
      font-family: monospace; font-size: .76rem;
      color: var(--text); background: var(--surface2);
      border-radius: 5px; padding: .25rem .6rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .calc-steps { display: flex; flex-direction: column; gap: .35rem; }
    .calc-step {
      display: flex; align-items: center; gap: .5rem;
      font-size: .8rem; color: var(--text);
    }
    .calc-arrow { color: var(--accent); font-size: .7rem; }

    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table td { padding: .3rem 0; font-size: .79rem; }
    .kv-table td:first-child { color: var(--muted); width: 60%; }
    .kv-table td:last-child { color: var(--text); font-weight: 600; text-align: right; font-family: monospace; overflow-wrap: anywhere; }

    /* Index recomputation (V3 provenance.confidence_inputs) */
    .recalc-status {
      padding: .5rem .75rem; border-radius: 7px; font-size: .8rem; font-weight: 600;
      border-left: 3px solid; margin-bottom: .6rem;
    }
    .recalc-ok  { background: color-mix(in srgb, var(--ok) 8%, transparent);   border-color: var(--ok);   color: var(--ok); }
    .recalc-bad { background: color-mix(in srgb, var(--warn) 8%, transparent); border-color: var(--warn); color: var(--warn); }
    .recalc-intro { font-size: .76rem; margin-bottom: .25rem; }
    .sub-label.score-label { text-transform: none; letter-spacing: .02em; font-size: .72rem; }
    .formula {
      font-family: monospace; font-size: .74rem; color: var(--text);
      background: var(--surface2); border-radius: 6px; padding: .45rem .6rem; margin-top: .45rem;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .recalc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-top: .9rem; font-size: .72rem; }
    .recalc-foot code { font-family: monospace; color: var(--accent); }
    .dl-btn {
      font: inherit; font-size: .75rem; font-weight: 600; cursor: pointer;
      padding: .35rem .7rem; border-radius: 7px;
      border: 1px solid var(--border2); background: var(--surface2); color: var(--text);
    }
    .dl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .rej-list { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
    .rej-list li { font-size: .76rem; color: var(--text); background: var(--surface2); border-radius: 5px; padding: .3rem .6rem; overflow-wrap: anywhere; }
    .rej-list .rej-rule { font-family: monospace; color: var(--muted); }

    /* Sub-section label */
    .sub-label {
      font-size: .65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--border2); margin-bottom: .5rem; margin-top: .75rem;
    }
    .sub-label:first-child { margin-top: 0; }

    /* ─── Warnings ───────────────────────────────────────────────── */
    .warn-list { display: flex; flex-direction: column; gap: .4rem; }
    .warn-item {
      padding: .45rem .75rem; border-radius: 7px;
      font-size: .78rem; border-left: 3px solid;
    }
    .warn-info    { background: color-mix(in srgb, var(--accent) 8%, transparent); border-color: var(--accent); color: var(--accent); }
    .warn-warning { background: color-mix(in srgb, var(--warn) 8%, transparent);   border-color: var(--warn);   color: var(--warn); }
    .warn-error   { background: color-mix(in srgb, var(--err) 8%, transparent);    border-color: var(--err);    color: var(--err); }
    .warn-code { font-weight: 700; margin-right: .35rem; }

    /* ─── Spinner ────────────────────────────────────────────────── */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .55s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Fade-in ────────────────────────────────────────────────── */
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ─── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 540px) {
      .price-amount { font-size: 2rem; }
      .conf-layout { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="48" height="48" fill="none">
          <circle cx="25" cy="32" r="16" fill="currentColor" opacity=".35"/>
          <circle cx="39" cy="32" r="16" fill="currentColor" opacity=".35"/>
          <circle cx="25" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
          <circle cx="39" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8"/>
          <circle cx="32" cy="32" r="4" fill="currentColor"/>
        </svg>
      </div>
      <h1>Open Price Explorer</h1>
    </div>

    <label for="api-url" data-i18n="apiLabel">API</label>

           placeholder="https://gateway.deepmining.ch/prices"
           spellcheck="false" onchange="onApiUrlChange()">

    <div class="ver-wrap">
      <div class="pill-group" id="ver-group">
        <button class="pill-btn"        data-ver="v1">V1</button>
        <button class="pill-btn"        data-ver="v2">V2</button>
        <button class="pill-btn active" data-ver="v3">V3</button>
      </div>
      <span class="info-tip" tabindex="0" id="ver-info-tip" data-i18n-attr-arialabel="verTipAria">i
        <span class="tip-box" id="ver-tip-box"><!-- filled by JS: updateStaticText() --></span>
      </span>
    </div>

    <div class="pill-group" id="lang-group">
      <button class="pill-btn"        data-lang="fr">FR</button>
      <button class="pill-btn active" data-lang="en">EN</button>
    </div>

    <button class="icon-btn" id="theme-toggle" type="button" onclick="toggleTheme()"><!-- filled by JS --></button>

    <span id="api-dot" style="color:var(--muted)">● …</span>

    <!-- Gateway API key: sent only in the X-API-Key header, never in the URL -->
    <div class="key-row">
      <label for="api-key" data-i18n="keyLabel">Clé API</label>
      <input type="password" id="api-key" autocomplete="off" spellcheck="false" autocapitalize="off"
             data-i18n-attr-placeholder="keyPlaceholder" onchange="onKeyChange()">
      <button class="icon-btn" id="key-toggle" type="button" onclick="toggleKeyVisibility()"><!-- filled by JS --></button>
      <label class="key-remember" data-i18n-attr-title="keyRememberTip">
        <input type="checkbox" id="key-remember" onchange="saveKey()">
        <span data-i18n="keyRemember">Mémoriser sur cet appareil</span>
      </label>
      <a class="key-link" href="https://fair.deepmining.ch/contact?subject=api-key" target="_blank" rel="noopener noreferrer"

    </div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="section-title" data-i18n="tokenTitle">Token</div>
    <div class="token-row" id="token-row">

    </div>

    <div class="divider"></div>

    <div class="section-title" data-i18n="timestampTitle">Horodatage</div>

    <div class="gran-row" style="margin-bottom:1rem;">
      <span class="gran-label" data-i18n="granLabel">Granularité :</span>
      <div class="gran-group">
        <button class="gran-btn active" data-gran="raw"    data-i18n="granRaw">Raw</button>
        <button class="gran-btn"        data-gran="minute" data-i18n="granMinute">Minute</button>
        <button class="gran-btn"        data-gran="hour"   data-i18n="granHour">Heure</button>
        <button class="gran-btn"        data-gran="day"    data-i18n="granDay">Jour</button>
      </div>
    </div>

    <div class="dt-row">
      <div class="field">
        <span class="field-label" data-i18n="dateLabel">Date</span>
        <input type="date" id="inp-date" oninput="updatePreview()">
      </div>
      <div class="field" id="fg-hour">
        <span class="field-label" data-i18n="hourLabel">Heure (UTC)</span>
        <input type="number" id="inp-hour" min="0" max="23" value="0" oninput="clamp(this,0,23); updatePreview()">
      </div>
      <div class="field" id="fg-minute">
        <span class="field-label" data-i18n="minuteLabel">Minute</span>
        <input type="number" id="inp-minute" min="0" max="59" value="0" oninput="clamp(this,0,59); updatePreview()">
      </div>
    </div>

    <div class="ts-preview" id="ts-preview"></div>

    <!-- Advanced -->
    <div class="adv-toggle" onclick="toggleAdv()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <span class="adv-chevron" id="adv-chev">▾</span>
    </div>

      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:.75rem;">
        <div class="field">

        </div>
        <div class="field">

          <select id="inp-branch">
            <option value="auto">auto</option>
            <option value="0a">0a: direct_stable</option>
            <option value="0b">0b: cross_rate</option>
            <option value="2">2: alternative_amm</option>
            <option value="3">3: chainlink_fallback</option>
          </select>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="btn-query" onclick="runQuery()">
      <span data-i18n="queryBtn">Interroger l'API</span>
    </button>
  </div>

    <div id="acc-section"></div>

let selectedToken   = 'ETH';
let selectedGran    = 'raw';
let selectedVersion = 'v3';
let lastResult       = null; // last successful API response, re-rendered on language switch
let lastResultLabel  = null; // { asset, version } of lastResult, for the "Result" header

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────

function init() {
  document.getElementById('api-url').value = defaultApiBase();
  restoreKey();

  // Default date = today
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('inp-date').value = today;

  // Fallback list until /v1/assets answers (see loadTokens)
  buildTokenPills(FALLBACK_TOKENS);

  // Granularity buttons
  document.querySelectorAll('.gran-btn').forEach(b => {
    b.addEventListener('click', () => selectGran(b.dataset.gran));
  });
  selectGran(selectedGran);

  // Version buttons
  document.querySelectorAll('#ver-group .pill-btn').forEach(b => {
    b.addEventListener('click', () => selectVersion(b.dataset.ver));
  });

  // Source / branch pairs refused by V3
  document.getElementById('inp-source').addEventListener('change', syncSourceBranch);
  document.getElementById('inp-branch').addEventListener('change', syncSourceBranch);
  syncSourceBranch();

  // Language buttons
  document.querySelectorAll('#lang-group .pill-btn').forEach(b => {
    b.addEventListener('click', () => selectLang(b.dataset.lang));
  });
  try {
    const savedLang = localStorage.getItem('op-lang');
    if (savedLang === 'fr' || savedLang === 'en') currentLang = savedLang;
  } catch (_) {}
  applyLang();

  initTheme();
  updatePreview();
  refreshApi();
}

// Language

function selectLang(l) {
  currentLang = l;
  try { localStorage.setItem('op-lang', l); } catch (_) {}
  applyLang();
}

function applyLang() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('#lang-group .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

  // Plain text nodes
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  // Attributes (aria-label, placeholder, title)
  document.querySelectorAll('[data-i18n-attr-arialabel]').forEach(el => {
    el.setAttribute('aria-label', t(el.dataset.i18nAttrArialabel));
  });
  document.querySelectorAll('[data-i18n-attr-placeholder]').forEach(el => {
    el.setAttribute('placeholder', t(el.dataset.i18nAttrPlaceholder));
  });
  document.querySelectorAll('[data-i18n-attr-title]').forEach(el => {
    el.setAttribute('title', t(el.dataset.i18nAttrTitle));
  });

  document.getElementById('ver-tip-box').innerHTML = t('verTipHtml');
  updateKeyToggle();
  renderDot();

  const btn = document.getElementById('btn-query');
  if (!btn.disabled) btn.querySelector('[data-i18n]').textContent = t('queryBtn');

  // Re-render the last result or error (if any) so every dynamically-built string updates too.
  if (lastResult) renderResult(lastResult);
  else if (lastError) renderLastError();
}

// ─────────────────────────────────────────────────────────────────────────────
// Theme
// ─────────────────────────────────────────────────────────────────────────────

function explicitTheme() {
  try {
    const t = localStorage.getItem('op-theme');
    return (t === 'light' || t === 'dark') ? t : null;
  } catch (_) { return null; }
}

function effectiveTheme() {
  return explicitTheme() || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function initTheme() {
  updateThemeButton();
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if (!explicitTheme()) updateThemeButton(); };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange); // older Safari
}

function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('op-theme', next); } catch (_) {}
  updateThemeButton();
}

function updateThemeButton() {
  const btn = document.getElementById('theme-toggle');
  const eff = effectiveTheme();
  btn.innerHTML = eff === 'dark' ? SUN_SVG : MOON_SVG; // icon = theme you'd switch TO
  btn.setAttribute('aria-label', t ? t('themeToggleAria') : 'Toggle light / dark theme');
  btn.title = btn.getAttribute('aria-label');
}

// ─────────────────────────────────────────────────────────────────────────────
// Tokens
// ─────────────────────────────────────────────────────────────────────────────

function buildTokenPills(tokens) {
  const row = document.getElementById('token-row');
  row.innerHTML = '';
  tokens.forEach(tok => {
    const btn = document.createElement('button');
    btn.className = 'token-btn' + (tok === selectedToken ? ' active' : '');
    btn.textContent = tok;
    btn.addEventListener('click', () => {
      selectedToken = tok;
      document.querySelectorAll('.token-btn').forEach(b => b.classList.toggle('active', b.textContent === tok));
    });
    row.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Granularity
// ─────────────────────────────────────────────────────────────────────────────

function selectGran(g) {
  selectedGran = g;
  document.querySelectorAll('.gran-btn').forEach(b => b.classList.toggle('active', b.dataset.gran === g));
  document.getElementById('fg-hour').style.display   = g === 'day' ? 'none' : '';
  document.getElementById('fg-minute').style.display = (g === 'minute' || g === 'raw') ? '' : 'none';
  updatePreview();
}

// ─────────────────────────────────────────────────────────────────────────────
// API version
// ─────────────────────────────────────────────────────────────────────────────

function selectVersion(v) {
  selectedVersion = v;
  document.querySelectorAll('#ver-group .pill-btn').forEach(b => b.classList.toggle('active', b.dataset.ver === v));
  syncSourceBranch();
}

// V3 refuses (HTTP 422) the source/branch pairs no source can satisfy: level 3 is Chainlink, levels 0a/0b/1/2 are
// DEX levels. V1/V2 accept them and answer from Chainlink. With V3 selected, the options that would form such a pair
// are disabled, and a branch that became impossible goes back to auto.
const V3_EXCLUDED_BRANCHES = { dex: ['3'], chainlink: ['0a', '0b', '1', '2'] };

function syncSourceBranch() {
  const src = document.getElementById('inp-source');
  const br  = document.getElementById('inp-branch');
  const refused = (source, branch) =>
    selectedVersion === 'v3' && (V3_EXCLUDED_BRANCHES[source] || []).includes(branch);
  if (refused(src.value, br.value)) br.value = 'auto';
  for (const o of br.options)  o.disabled = refused(src.value, o.value);
  for (const o of src.options) o.disabled = refused(o.value, br.value);
}

// ─────────────────────────────────────────────────────────────────────────────
// Timestamp preview
// ─────────────────────────────────────────────────────────────────────────────

function buildTimestamp() {
  const date = document.getElementById('inp-date').value || new Date().toISOString().slice(0, 10);
  const h = selectedGran !== 'day'                        ? pad(document.getElementById('inp-hour').value)   : '12';
  const m = (selectedGran === 'minute' || selectedGran === 'raw') ? pad(document.getElementById('inp-minute').value)  : '00';
  return `${date}T${h}:${m}:00Z`;
}

function updatePreview() {
  document.getElementById('ts-preview').textContent = buildTimestamp();
}

function pad(v) { return String(v || 0).padStart(2, '0'); }
function clamp(el, min, max) { el.value = Math.min(max, Math.max(min, parseInt(el.value) || 0)); }

// ─────────────────────────────────────────────────────────────────────────────
// Advanced panel
// ─────────────────────────────────────────────────────────────────────────────

function toggleAdv() {
  const panel = document.getElementById('adv-panel');
  const chev  = document.getElementById('adv-chev');
  panel.classList.toggle('open');
  chev.style.transform = panel.classList.contains('open') ? 'rotate(180deg)' : '';
}

// ─────────────────────────────────────────────────────────────────────────────
// API access: URL, key, status
// ─────────────────────────────────────────────────────────────────────────────

// The API serves this page at /ui (internal link): the API is then the page's own URL minus
// "/ui", and no key is needed. Anywhere else, go through the gateway.
function defaultApiBase() {
  const { protocol, origin, pathname } = window.location;
  if (protocol !== 'file:' && /\/ui\/?$/.test(pathname)) return origin + pathname.replace(/\/ui\/?$/, '');
  return GATEWAY_BASE;
}

function apiBase() { return document.getElementById('api-url').value.trim().replace(/\/+$/, ''); }
function apiKey()  { return document.getElementById('api-key').value.trim(); }

// Every API call goes through here. The key rides in the X-API-Key header, never in the URL
// (URLs end up in logs and browser history), and only when one was entered.
function apiFetch(path, options = {}) {
  const headers = new Headers(options.headers);
  const key = apiKey();
  if (key) headers.set('X-API-Key', key);
  return fetch(apiBase() + path, { ...options, headers });
}

// The key is kept in sessionStorage (survives a reload, gone when the tab closes), or in
// localStorage when "Remember on this device" is ticked; never in both.
function restoreKey() {
  let key = '', remembered = false;
  try {
    key = localStorage.getItem(KEY_STORAGE) || '';
    remembered = key !== '';
    if (!remembered) key = sessionStorage.getItem(KEY_STORAGE) || '';
  } catch (_) {}
  document.getElementById('api-key').value = key;
  document.getElementById('key-remember').checked = remembered;
}

function saveKey() {
  const key = apiKey();
  const remember = document.getElementById('key-remember').checked;
  try {
    localStorage.removeItem(KEY_STORAGE);
    sessionStorage.removeItem(KEY_STORAGE);
    if (key) (remember ? localStorage : sessionStorage).setItem(KEY_STORAGE, key);
  } catch (_) {}
}

function onKeyChange() {
  const input = document.getElementById('api-key');
  input.value = input.value.trim();
  saveKey();
  refreshApi();
}

function onApiUrlChange() {
  const input = document.getElementById('api-url');
  input.value = input.value.trim();
  refreshApi();
}

function toggleKeyVisibility() {
  const input = document.getElementById('api-key');
  input.type = input.type === 'password' ? 'text' : 'password';
  updateKeyToggle();
}

function updateKeyToggle() {
  const shown = document.getElementById('api-key').type === 'text';
  const btn = document.getElementById('key-toggle');
  btn.innerHTML = shown ? EYE_OFF_SVG : EYE_SVG; // icon = what a click does
  btn.setAttribute('aria-label', t(shown ? 'keyHide' : 'keyShow'));
  btn.title = btn.getAttribute('aria-label');
}

// Re-checks the status and reloads the token list after the API URL or the key changed.
// Wired to the fields' change event (blur / Enter), not to every keystroke: through the
// gateway, every call counts toward its per-IP rate limit.
function refreshApi() {
  const gen = ++apiGen;
  checkHealth(gen);
  loadTokens(gen);
}

async function checkHealth(gen) {
  healthState = 'pending';
  renderDot();
  let state;
  try {
    const r = await apiFetch('/health', { signal: AbortSignal.timeout(5000) });
    state = r.ok ? 'ok' : r.status === 401 ? 'keyMissing' : r.status === 403 ? 'keyInvalid' : String(r.status);
  } catch {
    state = 'offline';
  }
  if (gen !== apiGen) return; // the URL or the key changed meanwhile
  healthState = state;
  renderDot();
}

function renderDot() {
  const s = healthState;
  const [color, label] =
      s === 'pending'    ? ['--muted', '…']
    : s === 'ok'         ? ['--ok',    'ok']
    : s === 'keyMissing' ? ['--warn',  t('dotKeyMissing')]
    : s === 'keyInvalid' ? ['--err',   t('dotKeyInvalid')]
    : s === 'offline'    ? ['--err',   t('dotOffline')]
    :                      ['--warn',  s]; // any other HTTP status, shown as-is
  const dot = document.getElementById('api-dot');
  dot.style.color = `var(${color})`;
  dot.textContent = '● ' + label;
}

// Through the gateway without a valid key, /v1/assets answers 401/403: the current list stays.
async function loadTokens(gen) {
  try {
    const r = await apiFetch('/v1/assets', { signal: AbortSignal.timeout(5000) });
    if (!r.ok) return;
    const tokens = (await r.json()).assets.map(a => a.asset);
    if (gen !== apiGen || !tokens.length) return;
    if (!tokens.includes(selectedToken)) selectedToken = tokens[0];
    buildTokenPills(tokens);
  } catch (_) { /* keep the current list */ }
}

// ─────────────────────────────────────────────────────────────────────────────
// Query
// ─────────────────────────────────────────────────────────────────────────────

async function runQuery() {
  const btn = document.getElementById('btn-query');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> ${esc(t('queryBtnBusy'))}`;

  const ts     = buildTimestamp();
  const source = document.getElementById('inp-source').value;
  const branch = document.getElementById('inp-branch').value;
  const versionAtRequest = selectedVersion;
  const path   = `/${versionAtRequest}/prices/${selectedToken}/at?timestamp=${encodeURIComponent(ts)}&granularity=${selectedGran}&source=${source}&branch=${branch}&include_confidence=true&include_provenance=true`;

  try {
    const r = await apiFetch(path);
    if (!r.ok) {
      const body = await r.json().catch(() => null);
      lastResult = null;
      // Retry-After is readable cross-origin only if the gateway lists it in Access-Control-Expose-Headers
      lastError = { status: r.status, body, retryAfter: r.headers.get('Retry-After') };
      if (r.status === 401 || r.status === 403) {
        healthState = r.status === 401 ? 'keyMissing' : 'keyInvalid';
        renderDot();
      }
      renderLastError();
    } else {
      const body = await r.json();
      lastResult = body;
      lastError = null;
      lastResultLabel = { asset: selectedToken, version: versionAtRequest };
      renderResult(body);
    }
  } catch (e) {
    lastResult = null;
    lastError = { network: true, message: e.message, mixedContent: isMixedContent(apiBase()) };
    renderLastError();
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span data-i18n="queryBtn">${esc(t('queryBtn'))}</span>`;
  }
}

// An https page cannot call a plain-http API (loopback excepted): the browser blocks the
// request and fetch only reports a generic network error.
function isMixedContent(base) {
  return window.location.protocol === 'https:'
    && /^http:\/\//i.test(base)
    && !/^http:\/\/(localhost|127\.\d+\.\d+\.\d+|\[::1\])(:\d+)?(\/|$)/i.test(base);
}

// ─────────────────────────────────────────────────────────────────────────────
// Render error
// ─────────────────────────────────────────────────────────────────────────────

// Localized hint shown above the server's own message
const ERROR_HINTS = {
  401: 'errKeyMissing', 403: 'errKeyInvalid', 429: 'errRateLimited',
  502: 'errUnavailable', 503: 'errNotReady', 504: 'errTimeout',
};

// Two error shapes reach the page: FastAPI's {"detail": "..." | [{loc, msg}, ...]} from the
// API itself, and the gateway's {"error", "message"?}.
function serverMessage(body) {
  if (!body || typeof body !== 'object') return '';
  const d = body.detail;
  if (Array.isArray(d)) { // FastAPI validation error (422): one entry per invalid field
    return d.map(e => {
      const field = (e.loc || []).filter(p => p !== 'query' && p !== 'path').join('.');
      return field ? `${field}: ${e.msg}` : e.msg;
    }).join(' · ');
  }
  if (typeof d === 'string') return d;
  return String(body.message || body.error || '');
}

function renderLastError() {
  const e = lastError;
  if (e.network) {
    renderError(t('errTitle'), [e.mixedContent
      ? t('errMixedContent').replace('{gw}', GATEWAY_BASE)
      : t('errUnreachable') + e.message]);
    return;
  }
  const server = serverMessage(e.body);
  const lines = [];
  if (ERROR_HINTS[e.status]) lines.push(t(ERROR_HINTS[e.status]));
  // A 404 without an OpenPrice message (the gateway's "Endpoint not found", FastAPI's
  // "Not Found") means a wrong API URL, e.g. the gateway without /prices.
  if (e.status === 404 && (!server || server === 'Endpoint not found' || server === 'Not Found')) {
    lines.push(t('errNotFound').replace('{gw}', GATEWAY_BASE));
  }
  if (e.retryAfter) lines.push(t('errRetryAfter').replace('{s}', e.retryAfter));
  if (server) lines.push(server);
  renderError(`${t('errTitle')} ${e.status}`, lines);
}

function renderError(title, lines) {
  show('results');
  const detail = lines.map(l => '<br>' + esc(String(l))).join('');
  document.getElementById('card-price').innerHTML = `
    <div class="unavail-box"><strong>${esc(title)}</strong>${detail}</div>`;
  hide('card-conf');
  document.getElementById('acc-section').innerHTML = '';
  addClass('card-price', 'fade-in');
}

// ─────────────────────────────────────────────────────────────────────────────
// Render result
// ─────────────────────────────────────────────────────────────────────────────

function renderResult(d) {
  show('results');
  renderPrice(d);
  renderConfidence(d.confidence, d.price_usd);
  renderAccordions(d);
}

// ─── Price card ───────────────────────────────────────────────────────────────

function renderPrice(d) {
  const card = document.getElementById('card-price');
  card.className = 'card fade-in';

  const ver = (lastResultLabel && lastResultLabel.version) || selectedVersion;
  const isV2 = ver === 'v2' || ver === 'v3';  // V3 returns the V2 schema
  const verColor = ver === 'v3' ? 'var(--accent)' : 'var(--purple)';

  // V2 fragility badge: built once, used in both available and unavailable paths
  let fragilityBadge = '';
  if (isV2 && d.confidence && d.confidence.fragility_flag !== undefined) {
    const ff = d.confidence.fragility_flag;
    let flagLabel, flagVar;
    if (ff === null) { flagLabel = t('fragUncalibrated'); flagVar = '--muted'; }
    else if (ff) { flagLabel = t('fragFragile'); flagVar = '--err'; }
    else { flagLabel = t('fragUsable'); flagVar = '--ok'; }
    const thr = d.confidence.parameters && d.confidence.parameters.fragility_c_threshold;
    fragilityBadge = `
      <div style="display:flex;align-items:center;gap:.4rem;flex-shrink:0;">
        <span style="font-size:.85rem;font-weight:700;padding:.32rem .95rem;border-radius:999px;background:color-mix(in srgb, var(${flagVar}) 13%, transparent);color:var(${flagVar});border:1px solid color-mix(in srgb, var(${flagVar}) 35%, transparent);white-space:nowrap;">${esc(flagLabel)}</span>
        <span class="info-tip" tabindex="0" aria-label="${esc(t('fragAria'))}">i
          <span class="tip-box" style="right:0;">${t('fragTipHtml')(thr != null ? fmt(thr) : '0,57')}</span>
        </span>
      </div>`;
  }

  if (d.price_usd == null) {
    card.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:1rem;">

      </div>

    `;

  }

  const bi    = BRANCH_INFO[d.branch_level] || { label: d.branch_label, cls: 'b-4' };
  const dsMeta = t('dataStatus')[d.data_status];

// ─── Confidence card ──────────────────────────────────────────────────────────

function renderConfidence(c, price) {
  const card = document.getElementById('card-conf');
  if (!c || price == null) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  card.className = 'card fade-in';

  // Normalize V1 (flat, `score`) and V2 (`C` + nested `subscores` + `S_peg`)
  const score = c.score ?? c.C ?? 0;
  const subs  = c.subscores || c;           // V2 nests sub-scores, V1 keeps them flat
  const mode  = c.coherence_mode || c.composition_mode;

  const pct   = (score * 100).toFixed(1);
  const color = confColor(c);
  const R = 50, circ = 2 * Math.PI * R;
  const fill = score * circ;

  // S_peg lives outside `subscores` in V2; only shown when present
  const keys = ['S_stat', 'S_liq', 'S_coh'];
  if (c.S_peg !== undefined) keys.push('S_peg');
  const ssMeta = t('ssMeta');

  const subScores = keys.map(k => {
    const val = (k === 'S_peg') ? c.S_peg : subs[k];
    const m   = ssMeta[k];
    if (val == null) return `
      <div class="ss-row">
        <div class="ss-head">
          <span class="ss-name">${esc(m.label)}</span>
          <span class="ss-val" style="color:var(--muted)">n/a</span>
        </div>
        <div class="ss-desc">${esc(m.desc)}</div>
      </div>`;
    const p   = (val * 100).toFixed(1);
    const col = scoreColor(val);
    return `
      <div class="ss-row">
        <div class="ss-head">
          <span class="ss-name">${esc(m.label)}</span>
          <span class="ss-val" style="color:${col}">${p}%</span>
        </div>
        <div class="ss-desc">${esc(m.desc)}</div>
        <div class="prog">
          <div class="prog-fill" style="width:${p}%;background:${col}"></div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('conf-body').innerHTML = `
    <div class="conf-layout">
      <div class="gauge-wrap">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface3)" stroke-width="11"/>
          <circle cx="65" cy="65" r="${R}" fill="none" stroke="${color}" stroke-width="11"
            stroke-dasharray="${fill.toFixed(2)} ${circ.toFixed(2)}"
            stroke-linecap="round"
            transform="rotate(-90 65 65)"
          />
        </svg>
        <div class="gauge-label">
          <div class="gauge-score" style="color:${color}">${pct}%</div>
          <div class="gauge-sub">${esc(t('confidenceSub'))}</div>
        </div>
      </div>
      <div class="sub-scores">
        ${subScores}
        ${mode ? `<div style="font-size:.7rem;color:var(--muted);margin-top:.25rem;">${esc(t('mode'))} ${esc(mode)}</div>` : ''}
        ${warningListHtml(c.warnings)}
      </div>
    </div>
  `;
}

// ─── V3 provenance: on-chain events, rejected sources, versions ─────────────
function kvTable(rows) {
  const body = rows.filter(r => r && r[1] != null && r[1] !== '')
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(String(v))}</td></tr>`).join('');
  return body ? `<table class="kv-table">${body}</table>` : '';
}

function eventRows(ev) {
  const pv = t('pv');
  return kvTable([
    [pv.file, ev.file], [pv.time, fmtTs(ev.timestamp)], [pv.tx, ev.tx_hash],
    [pv.block, ev.block_number != null ? ev.block_number.toLocaleString(locale()) : null],
    [pv.logIndex, ev.log_index],
    [pv.phaseRound, ev.phase != null ? `${ev.phase} / ${ev.aggregator_round}` : null],
    [pv.sameTs, ev.rows_at_same_timestamp], [pv.tie, ev.tie_break_rule],
  ]);
}

function provenanceV3Html(p) {
  const pv = t('pv');
  let html = '';
  if (p.source_event) html += `<div class="sub-label">${esc(pv.event)}</div>${eventRows(p.source_event)}`;
  if (p.eth_usd_leg_event) html += `<div class="sub-label">${esc(pv.ethEvent)}</div>${eventRows(p.eth_usd_leg_event)}`;
  if (p.rejected_candidates && p.rejected_candidates.length) {
    const items = p.rejected_candidates.map(c =>
      `<li>${esc(c.level)} · ${esc(c.file)}${esc(colon())}${esc(c.message)} <span class="rej-rule">[${esc(c.rule)}]</span></li>`).join('');
    html += `<div class="sub-label">${esc(pv.rejected)}</div><ul class="rej-list">${items}</ul>`;
  }
  if (p.dataset_version || p.config_sha256 || p.code_commit) {
    const files = Object.entries(p.dataset_files || {}).map(([f, v]) => [f, v]);
    html += `<div class="sub-label">${esc(pv.versions)}</div>` + kvTable([
      [pv.dataVersion, p.dataset_version], [pv.config, p.config_sha256],
      [pv.commit, p.code_commit ? p.code_commit + (p.code_dirty ? pv.dirty : '') : null],
      ...files,
    ]);
  }
  return html;
}

// ─── V3 index recomputation (provenance.confidence_inputs) ──────────────────
// The formulas of the API (app/v3/service.py, and tools/verify_confidence.py), applied to the record alone.
function tvlScore(tvl, lq) {
  if (lq.tvl_score_mode === 'linear_to_threshold') return Math.min(1, tvl / lq.seuil_TVL_min_usd);
  if (lq.tvl_score_mode === 'binary_threshold') return tvl >= lq.seuil_TVL_min_usd ? 1 : 0;
  if (lq.tvl_score_mode === 'log_memoire') {
    const lo = lq.tvl_log_min_usd, ref = lq.tvl_log_ref_usd;
    if (tvl <= 0 || lo <= 0 || ref <= lo) return 0;
    return Math.max(0, Math.min(1, Math.log10(tvl / lo) / Math.log10(ref / lo)));
  }
  return null;
}

function recomputeIndex(ci) {
  const out = { S_stat: null, S_liq: null, S_coh: null, S_peg: null, legs: [] };
  const st = ci.s_stat;
  if (st) {
    if (st.rule === 'mad_zero') out.S_stat = 1;
    else if (st.rule === 'mad_z_score') {
      out.z = st.method === 'mad'
        ? 0.6745 * Math.abs(st.price_tested - st.median) / st.mad
        : Math.abs(Math.log(st.price_tested) - st.median_log) / st.local_volatility;
      out.S_stat = Math.exp(-(out.z ** 2) / (2 * st.sigma_mad ** 2));
    } else out.S_stat = st.floor;
  }
  const lq = ci.s_liq;
  if (lq) {
    const eth = lq.legs.find(l => l.role === 'eth_usd_leg');
    lq.legs.forEach((leg, k) => {
      let tvl = leg.tvl_raw;
      if (k === 0 && eth && leg.tvl_unit === 'eth' && tvl != null && eth.price != null) tvl = tvl * eth.price;
      const sTvl = tvl == null ? null : tvlScore(tvl, lq);
      const sSlip = leg.slippage == null ? null : Math.exp(-Math.abs(leg.slippage) / lq.slip_max);
      const v = sTvl != null && sSlip != null ? Math.sqrt(sTvl * sSlip) : (sTvl != null ? sTvl : sSlip);
      out.legs.push({ tvl, sTvl, sSlip, v });
    });
    const [a, b] = out.legs.map(l => l.v);
    out.S_liq = eth ? (a != null && b != null ? Math.sqrt(a * b) : (a != null ? a : (b != null ? b : null)))
                    : (a != null ? a : null);
  }
  const ch = ci.s_coh;
  if (ch && ch.rule === 'deviation') {
    const pcl = ch.chainlink_round.answer;
    out.delta = Math.abs(ch.price_compared - pcl) / pcl;
    out.S_coh = Math.exp(-((out.delta / ch.delta_tol) ** 2));
  }
  const pg = ci.s_peg;
  if (pg && pg.rule === 'peg_deviation') out.S_peg = Math.exp(-((Math.abs(pg.peg - 1) / pg.peg_tol) ** 2));
  const comp = ci.composition, w = comp.weights;
  if (comp.mode === '4sub') {
    const s = [out.S_stat, out.S_liq, out.S_coh, out.S_peg], ws = [w.w_stat, w.w_liq, w.w_coh, w.w_peg];
    const total = ws.reduce((x, y) => x + y, 0);
    out.C = s.includes(null) ? null : s.reduce((acc, x, i) => acc * x ** (ws[i] / total), 1);
  } else {
    out.C = [out.S_stat, out.S_liq, out.S_coh].includes(null) ? null
      : out.S_stat ** w.w_stat * out.S_liq ** w.w_liq * out.S_coh ** w.w_coh;
  }
  out.flag = out.C == null || comp.fragility_c_threshold == null ? null : out.C < comp.fragility_c_threshold;
  return out;
}

function sameNum(a, b) {
  if (a == null || b == null || typeof a === 'boolean' || typeof b === 'boolean') return a === b || (a == null && b == null);
  return a === b || Math.abs(a - b) <= 1e-12 * Math.max(Math.abs(a), Math.abs(b));
}

function num(v, sig = 6) {
  if (v == null) return 'n/a';
  if (v !== 0 && (Math.abs(v) < 1e-4 || Math.abs(v) >= 1e15)) return v.toExponential(sig - 1);
  return v.toLocaleString(locale(), { maximumSignificantDigits: sig });
}

function pct(v) {
  return v == null ? 'n/a' : (v * 100).toLocaleString(locale(), { maximumSignificantDigits: 4 }) + ' %';
}

function recalcHtml(d) {
  const ci = d.provenance.confidence_inputs, R = recomputeIndex(ci), rc = t('rc'), conf = d.confidence;
  const comp = ci.composition;
  const served = conf
    ? { S_stat: conf.subscores.S_stat, S_liq: conf.subscores.S_liq, S_coh: conf.subscores.S_coh, S_peg: conf.S_peg,
        C: conf.C, flag: conf.fragility_flag }
    : { S_stat: ci.s_stat && ci.s_stat.value, S_liq: ci.s_liq && ci.s_liq.value, S_coh: ci.s_coh && ci.s_coh.value,
        S_peg: ci.s_peg && ci.s_peg.value, C: comp.C, flag: comp.fragility_flag };
  const ok = ['S_stat', 'S_liq', 'S_coh', 'S_peg', 'C', 'flag'].every(k => sameNum(R[k], served[k]));
  const rule = r => rc.rules[r] || r;
  let html = `<div class="recalc-status ${ok ? 'recalc-ok' : 'recalc-bad'}">${ok ? '✓' : '⚠'} ${esc(rc.status(num(R.C), ok))}</div>`
           + `<p class="recalc-intro">${esc(rc.intro)}</p>`;

  const st = ci.s_stat;
  if (st) {
    let f = '';
    if (st.rule === 'mad_z_score' && st.method === 'mad')
      f = `z = ${num(0.6745)} × |${num(st.price_tested, 10)} − ${num(st.median, 10)}| / ${num(st.mad, 10)} = ${num(R.z)}\n`
        + `S_stat = exp(−z² / (2 × ${num(st.sigma_mad)}²)) = ${num(R.S_stat)}`;
    else if (st.rule === 'mad_z_score')
      f = `z = |ln ${num(st.price_tested, 10)} − ${num(st.median_log, 10)}| / ${num(st.local_volatility, 10)} = ${num(R.z)}\n`
        + `S_stat = exp(−z² / (2 × ${num(st.sigma_mad)}²)) = ${num(R.S_stat)}`;
    else if (st.rule === 'insufficient_data_floor') f = `n = ${st.n_observations} < ${st.min_observations} → S_stat = ${num(st.floor)}`;
    else if (st.rule === 'mad_zero') f = 'MAD = 0 → S_stat = 1';
    else f = `S_stat = ${num(R.S_stat)}`;
    html += `<div class="sub-label score-label">S_stat</div>` + kvTable([
      [rc.reference, `${st.reference_file} (${rc.kind[st.reference_kind] || st.reference_kind})`],
      [rc.window, `${fmtTs(st.window_start_utc)} → ${fmtTs(st.window_end_utc)}`],
      [rc.servedPhases, st.served_phases ? st.served_phases.map(s => `${s.phase}${colon()}${fmtTs(s.from_utc)} → ${fmtTs(s.to_utc)}`).join('; ') : null],
      [rc.nObs, st.n_observations.toLocaleString(locale())],
      [rc.median, st.median != null ? num(st.median, 10) : null], [rc.mad, st.mad != null ? num(st.mad, 10) : null],
      [`${rc.priceTested} (${st.price_tested_field})`, num(st.price_tested, 10)],
      [rc.rule, rule(st.rule)],
    ]) + `<div class="formula">${esc(f)}</div>`;
  }

  const lq = ci.s_liq;
  if (lq) {
    html += `<div class="sub-label score-label">S_liq</div>`;
    lq.legs.forEach((leg, k) => {
      const r = leg.row, L = R.legs[k];
      const tvlTxt = leg.tvl_raw == null ? 'n/a'
        : `${num(leg.tvl_raw, 10)} ${leg.tvl_unit === 'eth' ? 'ETH' : 'USD'}`
          + (leg.tvl_unit === 'eth' && leg.eth_usd_price_for_tvl != null ? ` × ${num(leg.eth_usd_price_for_tvl, 10)} = ${num(leg.tvl_usd, 10)} USD` : '');
      html += kvTable([
        [rc.roles[leg.role] || leg.role, leg.file],
        [rc.row, r ? `${fmtTs(r.timestamp)}` + (r.block_number != null ? ` · ${t('pv').block} ${r.block_number} / log ${r.log_index}` : '') : null],
        [`TVL (${leg.tvl_column || '—'})`, tvlTxt],
        [`${rc.slippage} (${leg.slippage_column || '—'})`, leg.slippage != null ? num(leg.slippage, 10) : 'n/a'],
        ...(leg.role === 'eth_usd_leg' && leg.price != null ? [[`ETH/USD (${leg.price_column})`, num(leg.price, 10)]] : []),
        [rc.legScore, `${num(L.sTvl)} · ${num(L.sSlip)} → ${num(L.v)}`],
      ]);
    });
    const tvlF = lq.tvl_score_mode === 'log_memoire'
      ? `S_TVL = clamp(log10(TVL / ${num(lq.tvl_log_min_usd)}) / log10(${num(lq.tvl_log_ref_usd)} / ${num(lq.tvl_log_min_usd)}), 0, 1)`
      : lq.tvl_score_mode === 'linear_to_threshold' ? `S_TVL = min(1, TVL / ${num(lq.seuil_TVL_min_usd)})`
      : rc.binary(num(lq.seuil_TVL_min_usd));
    const comb = lq.rule === 'geometric_mean_of_legs'
      ? `S_liq = √(${num(R.legs[0].v)} × ${num(R.legs[1].v)}) = ${num(R.S_liq)}` : `S_liq = ${num(R.S_liq)}`;
    html += kvTable([[rc.combination, rule(lq.rule)]])
          + `<div class="formula">${esc(`${tvlF}\nS_slip = exp(−|slip| / ${num(lq.slip_max)}), ${rc.legWord} = √(S_TVL × S_slip)\n${comb}`)}</div>`;
  }

  const ch = ci.s_coh;
  if (ch) {
    const r = ch.chainlink_round;
    html += `<div class="sub-label score-label">S_coh</div>` + kvTable([
      [rc.round, r ? r.file : null],
      [t('pv').phaseRound, r && r.phase != null ? `${r.phase} / ${r.aggregator_round}` : null],
      [rc.roundId, r ? r.global_round_id : null],
      [rc.published, r ? fmtTs(r.timestamp) : null],
      [rc.answer, r ? num(r.answer, 10) : null],
      [`${rc.priceCompared} (${ch.price_compared_field})`, num(ch.price_compared, 10)],
      [rc.delta, pct(ch.delta)], [rc.deltaTol, pct(ch.delta_tol)], [rc.rule, rule(ch.rule)],
    ]) + (ch.rule === 'deviation'
      ? `<div class="formula">${esc(`δ = |${num(ch.price_compared, 10)} − ${num(r.answer, 10)}| / ${num(r.answer, 10)} = ${pct(R.delta)}\nS_coh = exp(−(δ / ${pct(ch.delta_tol)})²) = ${num(R.S_coh)}`)}</div>` : '');
  }

  const pg = ci.s_peg;
  if (pg) {
    const r = pg.peg_round;
    html += `<div class="sub-label score-label">S_peg</div>` + kvTable([
      [rc.quote, pg.quote_currency],
      [rc.pegRound, r ? `${r.file} · ${r.phase != null ? r.phase + ' / ' + r.aggregator_round + ' · ' : ''}${fmtTs(r.timestamp)}` : null],
      [rc.peg, pg.peg != null ? num(pg.peg, 10) : null], [rc.pegTol, pct(pg.peg_tol)], [rc.rule, rule(pg.rule)],
    ]) + (pg.rule === 'peg_deviation'
      ? `<div class="formula">${esc(`S_peg = exp(−(|${num(pg.peg, 10)} − 1| / ${num(pg.peg_tol)})²) = ${num(R.S_peg)}` + (comp.mode === '3sub' ? `\n${rc.outsideC}` : ''))}</div>` : '');
  }

  const w = comp.weights;
  const cF = comp.mode === '4sub'
    ? `C = (S_stat^${num(w.w_stat)} × S_liq^${num(w.w_liq)} × S_coh^${num(w.w_coh)} × S_peg^${num(w.w_peg)})^(1 / Σw) = ${num(R.C)}`
    : `C = ${num(R.S_stat)}^${num(w.w_stat, 10)} × ${num(R.S_liq)}^${num(w.w_liq, 10)} × ${num(R.S_coh)}^${num(w.w_coh, 10)} = ${num(R.C)}`;
  const flagTxt = R.flag == null ? 'n/a' : (R.flag ? rc.fragile : rc.usable);
  html += `<div class="sub-label score-label">C</div><div class="formula">${esc(cF + (comp.fragility_c_threshold != null
            ? `\nC ${R.flag ? '<' : '≥'} ${num(comp.fragility_c_threshold)} (${rc.threshold}) → ${flagTxt}` : ''))}</div>`;

  html += `<div class="recalc-foot"><button type="button" class="dl-btn" id="dl-record">⬇ ${esc(rc.download)}</button>`
        + `<span>${rc.verifyHint}</span></div>`;
  return html;
}

function downloadRecord(d) {
  const blob = new Blob([JSON.stringify(d, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `openprice_${d.asset}_${String(d.timestamp || '').replace(/[:]/g, '-')}_${d.granularity || 'raw'}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────

function warningListHtml(warnings) {
  if (!warnings || !warnings.length) return '';
  const items = warnings.map(w => `
    <div class="warn-item warn-${esc(w.severity || 'warning')}">
      <span class="warn-code">[${esc(w.code)}]</span>${esc(w.message)}
    </div>`).join('');
  return `<div class="warn-list" style="margin-top:.75rem">${items}</div>`;
}

function scoreColor(v) {
  if (v == null) return 'var(--muted)';
  return v >= 0.7 ? 'var(--ok)' : v >= 0.4 ? 'var(--warn)' : 'var(--err)';
}

// C takes the colour of its fragility flag, which applies the threshold of the price's granularity
// (v3.fragility_c_threshold_by_granularity): a fixed grid would show an hourly C of 0.78 in green next to "fragile".
// Without a flag (V1, or no calibrated threshold) C stays neutral.
function confColor(c) {
  if (c && c.fragility_flag === true) return 'var(--err)';
  if (c && c.fragility_flag === false) return 'var(--ok)';
  return 'var(--accent)';
}

function fmt(n) {
  if (n == null) return 'n/a';
  if (n >= 1000) return n.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (n >= 1)    return n.toLocaleString(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  return n.toLocaleString(locale(), { minimumFractionDigits: 4, maximumFractionDigits: 8 });
}

function fmtTs(ts) {
  if (!ts) return 'n/a';
  const d = new Date(ts);
  return d.toLocaleString(locale(), {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    timeZone:'UTC',
  }) + ' UTC';
}

function fmtLag(s) {
  if (s == null) return 'n/a';
  if (s < 60)   return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.round(s / 60)}min`;
  return `${(s / 3600).toFixed(1)}h`;
}

function fmtWin(s) {
  if (s == null) return 'n/a';
  const human = s < 60 ? `${s} s` : s < 3600 ? `${s / 60} min` : `${s / 3600} h`;
  return `${s.toLocaleString(locale())} s${s >= 60 ? ` (${human})` : ''}`;
}

function lagSeconds(req, obs) {
  if (!req || !obs) return null;
  return Math.round((new Date(req) - new Date(obs)) / 1000);
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function addClass(id, cls) {
  const el = document.getElementById(id);
  el.classList.remove(cls);
  void el.offsetWidth; // force reflow
  el.classList.add(cls);
}

// ─────────────────────────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────────────────────────

init();
</script>

</html>
