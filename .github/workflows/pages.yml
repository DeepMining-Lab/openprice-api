# Publishes the web explorer (interface-api/: index.html + favicon.svg) to GitHub Pages:
# https://openprice-explorer.deepmining.ch/ (custom domain; the github.io URL redirects to it)
# Only that folder is published, not the rest of the repository. The FastAPI app keeps
# serving the same file at /ui.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'interface-api/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; an in-progress deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: interface-api
      - id: deployment
        uses: actions/deploy-pages@v5
