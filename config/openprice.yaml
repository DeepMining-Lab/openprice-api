api:
  name: "OpenPrice API"
  version: "0.1.0"
  default_limit: 1000
  max_limit: 10000

paths:
  datasets_root: "~/openprice/datasets"

thresholds:
  seuil_TVL_min_usd: 100000
  seuil_vol_min_usd_24h: 10000
  fenetre_inactivite_jours: 30
  min_swaps_for_stat_score: 3
  s_stat_floor: 0.2
  slip_reference_order_usd: 1000
  slip_max: 0.005
  sigma_mad: 3.5
  cross_rate_max_lag_seconds: 3600
  chainlink_default_heartbeat_seconds: 86400

confidence_weights:
  w_stat: 0.3333333333
  w_liq: 0.3333333333
  w_coh: 0.3333333334

chainlink:
  default_deviation_threshold: 0.005
  deviation_threshold_by_asset:
    ETH: 0.005
    LINK: 0.005
    UNI: 0.005
    AAVE: 0.005
    COMP: 0.01
  heartbeat_seconds_by_asset:
    ETH: 86400
    LINK: 86400
    UNI: 86400
    AAVE: 86400
    COMP: 86400

scoring:
  tvl_score_mode: "log_memoire"
  tvl_log_min_usd: 10000
  tvl_log_ref_usd: 1000000

# --- API V2 confidence index -------------------------------
# Distinct block: never overrides the V1 keys above. The V1 routes (/v1/...)
# ignore this block entirely and stay byte-for-byte identical.
confidence_v2:
  composite:
    mode: "3sub"            # 3sub (default) | 4sub
  weights:
    w_stat: 0.3333333333
    w_liq:  0.3333333333
    w_coh:  0.3333333334
    w_peg:  0.25            # used only in 4sub mode (weights renormalized)
  coh:
    default_delta_tol: 0.005
    # Calibrated empirically on the p90 of the observed |neutralized DEX - CEX|/CEX
    # dispersion per asset (8-regime replay, mémoire §8.4). Decoupled from the
    # native Chainlink feed thresholds, which the expert found too strict.
    delta_tol_by_asset:
      ETH: 0.013
      LINK: 0.019
      UNI: 0.020
      AAVE: 0.026
      COMP: 0.031
  peg:
    tol: 0.0025             # 0.25 % USDC/USDT (confirmed: S_peg≈1 off-peg, →0 at depeg)
  s_stat:
    window_seconds: 604800  # 7 days; can be shortened for sensitivity tests
    volatility_estimator: "MAD"   # MAD | realized_vol
    normalize_by_volatility: false
  fragility:
    c_threshold: 0.57       # calibrated at hourly granularity (ROC/Youden, AUC=0.80, mémoire §8.4)

# --- API V3 performance engine ------------------------------
# Isolated block: V1/V2 ignore it. V3 reads a Parquet copy of the CSV datasets built by
#   python -m app.v3.sync        (incremental; run it after each daily CSV update)
v3:
  parquet_root: "~/openprice/parquet"   # derived data; never inside the datasets directory
  legacy_truncation: false               # true = replay V1/V2 exactly (windows cut to api.max_limit rows, CSV-order ties, all Chainlink phases)
  chainlink_active_phase_only: true      # Chainlink: only the rounds of the aggregator phase the proxy served at T
  # Corrections of the V1/V2 source hierarchy (ignored in legacy mode):
  strict_source_filter: true             # source=dex never answers from Chainlink; contradictory source/branch pairs and branch=4 -> 422
  windowed_lag_check: "eth_leg"          # hour/day cross-rate: |T - ETH/USD leg| <= cross_rate_max_lag_seconds (V1/V2: "last_swap", the token pool's last swap before T)
  raw_max_age_seconds: 3600              # raw DEX read: observations older than this before T are rejected (null = no limit, V1/V2)
  no_swap_is_zero_volume: true           # zombie rule: no swap in the 24 h before T = 0 USD volume (V1/V2 skipped the check)
  windowed_eth_leg: "vwmp"               # hour/day cross-rate: ETH/USD leg = VWMP over the token leg's window (V1/V2: "point", one swap)
  v2_oracle_coherence_label: false       # level 3: coherence_mode null (V2: "oracle_only_staleness", with no S_coh computed)
  # Level 3 (Chainlink): no confidence index; warning oracle_stale when the round is older than heartbeat x (1 + tolerance)
  oracle_heartbeat_seconds:              # as declared by the extraction (heartbeat_seconds column of the Chainlink CSVs)
    ETH: 3600
    LINK: 3600
    UNI: 3600
    AAVE: 3600
    COMP: 3600
  oracle_stale_tolerance: 0.1            # since 2022, consecutive rounds were > 3 960 s apart only 2 to 4 times per feed
  rpc_url_env: "OPENPRICE_RPC_URL"       # env variable with the Ethereum RPC URL; the sync reads the proxy phase switches with it
  cache_size: 4096                       # LRU of point responses, invalidated on every dataset_version change
  duckdb_threads: 4
  duckdb_memory_limit: "1GB"             # DuckDB cache per API worker process (3 workers: ~3 GB at most)
  range_workers: 8                       # points of one range request computed in parallel
  native_store: true                     # read the native DuckDB copy of each dataset built by the sync (Parquet = reference, fallback)
  batch_ranges: true                     # ranges and /compare read the per-point lookups of all their timestamps in bulk
  batch_workers: 6                       # threads per range request in that mode (measured: 2 best for lookups only, 8 for ETH windows)
  manifest_poll_seconds: 5
  max_segments_before_compaction: 30
